{% extends "base.html" %}
{% block title %}Register - Asset Management System{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px;">
    <h1>Create an Account</h1>
    <p class="subtitle">Register as an employee to request and track assets</p>
    <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="full_name" required value="{{ form.full_name if form else '' }}">
        </div>
        <div class="form-group">
          <label>Username *</label>
          <input type="text" name="username" required value="{{ form.username if form else '' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="email" required value="{{ form.email if form else '' }}">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" value="{{ form.phone if form else '' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <select name="department_id">
            <option value="">Select department</option>
            {% for d in departments %}
            <option value="{{ d.id }}">{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" name="employee_id" placeholder="e.g. EMP-101" value="{{ form.employee_id if form else '' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password * (min 8 characters)</label>
          <div class="password-field">
            <input type="password" name="password" id="regPassword" minlength="8" required>
            <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <div class="password-field">
            <input type="password" name="confirm_password" id="regConfirmPassword" minlength="8" required>
            <button type="button" class="password-toggle" onclick="togglePassword('regConfirmPassword', this)">👁️</button>
          </div>
        </div>
      </div>
      <div class="form-error" id="regError" style="display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;">Register</button>
    </form>
    <p class="foot-link">Already have an account? <a href="{{ url_for('auth.login') }}" style="color:var(--primary); font-weight:600;">Login</a></p>
  </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
  const pw = document.getElementById('regPassword').value;
  const cpw = document.getElementById('regConfirmPassword').value;
  const err = document.getElementById('regError');
  err.style.display = 'none';
  if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; e.preventDefault(); return; }
  if (pw !== cpw) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; e.preventDefault(); return; }
});
</script>
{% endblock %}
