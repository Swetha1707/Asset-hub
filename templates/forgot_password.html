{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your registered email and an administrator will assist you</p>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Send Reset Instructions</button>
    </form>
    <p class="foot-link"><a href="{{ url_for('auth.login') }}" style="color:var(--primary); font-weight:600;">← Back to login</a></p>
  </div>
</div>
{% endblock %}
