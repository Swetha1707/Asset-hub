{% extends "base.html" %}

{% block title %}Add Admin - AssetHub{% endblock %}

{% block page_title %}Add Admin{% endblock %}

{% block content %}

<div class="page-header">
  <div>
    <h1>Add Admin</h1>
    <p>Create a new administrator account.</p>
  </div>
</div>

<div class="card" style="max-width:650px; margin:0 auto; padding:24px;">

  <form method="POST" action="{{ url_for('auth.add_admin') }}">

    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        name="full_name"
        class="form-control"
        placeholder="Enter full name"
        required
      >
    </div>

    <div class="form-group">
      <label>Username</label>
      <input
        type="text"
        name="username"
        class="form-control"
        placeholder="Enter username"
         autocomplete="off"
        required
      >
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        class="form-control"
        placeholder="Enter email"
        required
      >
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input
        type="text"
        name="phone"
        class="form-control"
        placeholder="Enter phone number"
      >
    </div>

    <div class="form-group">
  <label>Password</label>

  <div style="position:relative;">
    <input
      type="password"
      name="password"
      id="adminPassword"
      class="form-control"
      placeholder="Enter password"
      minlength="8"
      autocomplete="new-password"
      required
      style="padding-right:45px;"
    >

    <button
      type="button"
      onclick="togglePassword('adminPassword', this)"
      style="
        position:absolute;
        right:12px;
        top:50%;
        transform:translateY(-50%);
        background:none;
        border:none;
        cursor:pointer;
        font-size:16px;
      "
    >
      👁️
    </button>
  </div>
</div>

<div class="form-group">
  <label>Confirm Password</label>

  <div style="position:relative;">
    <input
      type="password"
      name="confirm_password"
      id="adminConfirmPassword"
      class="form-control"
      placeholder="Confirm password"
      minlength="8"
       autocomplete="new-password"
      required
      style="padding-right:45px;"
    >

    <button
      type="button"
      onclick="togglePassword('adminConfirmPassword', this)"
      style="
        position:absolute;
        right:12px;
        top:50%;
        transform:translateY(-50%);
        background:none;
        border:none;
        cursor:pointer;
        font-size:16px;
      "
    >
      👁️
    </button>
  </div>
</div>

    <button type="submit" class="btn btn-primary">
      Create Admin
    </button>

  </form>

</div>

{% endblock %}
