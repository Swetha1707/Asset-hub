{% extends "base.html" %}
{% block title %}Login - Asset Hub{% endblock %}
{% block auth_content %}
<style>
  /* ============ Scoped styles for this page only ============ */
  .tms-page {
    min-height: 100vh;
    width: 100%;
    background: #eef1fb;
    background-image: radial-gradient(#c7ceee 1.4px, transparent 1.4px);
    background-size: 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    position: relative;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  }
  .tms-ring {
    position: absolute;
    top: 36px;
    right: 64px;
    width: 46px;
    height: 46px;
    border: 7px solid #cfe0ff;
    border-radius: 50%;
    opacity: .9;
  }
  .tms-card {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    max-width: 900px;
    min-height: 480px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 30px 60px rgba(40,60,140,.18);
    overflow: hidden;
  }

  /* -------- Left: form panel -------- */
  .tms-form-panel {
    flex: 1 1 46%;
    padding: 46px 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tms-logo-badge {
  width: 64px;
  height: 64px;
  margin: 0 auto 10px;
}

.tms-logo-badge img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
  .tms-brand {
    text-align: center;
    color: #3f6fe0;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: .01em;
    margin-bottom: 30px;
  }
  .tms-welcome {
    font-size: 24px;
    font-weight: 800;
    color: #1b2340;
    margin: 0 0 4px;
  }
  .tms-subtitle {
    font-size: 13px;
    color: #9aa1b6;
    margin: 0 0 26px;
  }
  .tms-field { margin-bottom: 16px; }
  .tms-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 6px;
  }
  .tms-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .tms-input-wrap .tms-icon {
    position: absolute;
    left: 13px;
    font-size: 14.5px;
    color: #a6acc2;
    pointer-events: none;
  }
  .tms-input-wrap input {
    width: 100%;
    padding: 11px 40px 11px 38px;
    border: 1.5px solid #e4e7f2;
    border-radius: 10px;
    font-size: 13.5px;
    background: #fbfbfe;
    color: #1b2340;
    transition: border-color .15s;
  }
  .tms-input-wrap input:focus {
    outline: none;
    border-color: #6ea8ff;
    background: #fff;
  }
  .tms-input-wrap .tms-eye {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #a6acc2;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }
  .tms-forgot-row {
    display: flex;
    justify-content: flex-end;
    margin: 4px 0 22px;
  }
  .tms-forgot-row a {
    font-size: 12.5px;
    color: #3f6fe0;
    text-decoration: none;
    font-weight: 500;
  }
  .tms-forgot-row a:hover { text-decoration: underline; }
  .tms-login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #5a8dfb, #3f6fe0);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(63,111,224,.32);
    transition: transform .05s, opacity .15s;
  }
  .tms-login-btn:hover { opacity: .94; }
  .tms-login-btn:active { transform: scale(.98); }
  .tms-register-link {
    text-align: center;
    font-size: 12.5px;
    color: #9aa1b6;
    margin-top: 16px;
  }
  .tms-register-link a { color: #3f6fe0; font-weight: 600; text-decoration: none; }
  .tms-footer {
    text-align: center;
    font-size: 11px;
    color: #b7bccb;
    margin-top: 28px;
  }
  .tms-demo-note {
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: #8891ab;
    background: #f3f6ff;
    border: 1px dashed #d6e0ff;
    border-radius: 8px;
    padding: 8px 10px;
    line-height: 1.6;
  }
  .tms-demo-note code { color: #3f6fe0; font-weight: 700; }

  /* -------- Right: illustration panel -------- */
  .tms-art-panel {
    flex: 1 1 54%;
    position: relative;
    background: linear-gradient(160deg, #4f7dfb 0%, #3660d9 55%, #24469c 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tms-art-panel::before {
    content: "";
    position: absolute;
    inset: -20% -10%;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.10) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.08) 0 60px, transparent 61px),
      radial-gradient(circle at 20% 80%, rgba(255,255,255,.07) 0 90px, transparent 91px);
    background-size: 30px 30px, auto, auto;
  }
  .tms-art-panel .tms-svg-wrap {
    position: relative;
    z-index: 2;
    width: 82%;
    max-width: 340px;
  }
  .tms-tri {
    position: absolute;
    color: rgba(255,255,255,.55);
    font-size: 15px;
    z-index: 2;
  }

  @media (max-width: 760px) {
    .tms-card { flex-direction: column; max-width: 420px; min-height: 0; }
    .tms-art-panel { min-height: 220px; order: -1; }
    .tms-form-panel { padding: 34px 26px; }
  }
</style>

<div class="tms-page">
  <div class="tms-ring"></div>

  <div class="tms-card">
    <div class="tms-form-panel">
<div class="tms-logo-badge">
  <img src="{{ url_for('static', filename='images/assethub-logo.png') }}" alt="AssetHub Logo">
</div>      <div class="tms-brand">Asset-Hub</div>


      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="tms-field">
          <label>Username</label>
          <div class="tms-input-wrap">
            <span class="tms-icon">👤</span>
            <input type="text" name="identifier" required autofocus placeholder="Username">
          </div>
        </div>

        <div class="tms-field" style="margin-bottom:0;">
          <label>Password</label>
          <div class="tms-input-wrap">
            <span class="tms-icon">🔒</span>
            <input type="password" name="password" id="loginPassword" required placeholder="Password">
            <button type="button" class="tms-eye" onclick="togglePassword('loginPassword', this)">👁️</button>
          </div>
        </div>

        <div class="tms-forgot-row">
          <a href="{{ url_for('auth.forgot_password') }}">Forget password?</a>
        </div>

        <button type="submit" class="tms-login-btn">Login</button>
      </form>

      <p class="tms-register-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>

      

    <div class="tms-art-panel">
      <span class="tms-tri" style="top:18%; left:14%;">&#9664;</span>
      <span class="tms-tri" style="top:38%; right:10%;">&#9664;</span>
      <span class="tms-tri" style="bottom:14%; left:22%;">&#9664;</span>
      <span class="tms-tri" style="bottom:28%; right:20%;">&#9664;</span>

      <svg class="tms-svg-wrap" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <g opacity="0.95">
          <polygon points="40,150 70,134 100,150 70,166" fill="#bfe3e8"/>
          <polygon points="40,150 70,166 70,196 40,180" fill="#8fc9d1"/>
          <polygon points="100,150 70,166 70,196 100,180" fill="#a9d8de"/>
        </g>
        <g opacity="0.95">
          <polygon points="220,120 250,104 280,120 250,136" fill="#cfe0f7"/>
          <polygon points="220,120 250,136 250,166 220,150" fill="#a9c3ea"/>
          <polygon points="280,120 250,136 250,166 280,150" fill="#bcd2f0"/>
        </g>
        <g opacity="0.95">
          <polygon points="230,210 258,195 286,210 258,225" fill="#bfe3e8"/>
          <polygon points="230,210 258,225 258,252 230,238" fill="#8fc9d1"/>
          <polygon points="286,210 258,225 258,252 286,238" fill="#a9d8de"/>
        </g>

        <g transform="translate(90,60)">
          <line x1="70" y1="10" x2="70" y2="26" stroke="#e7ecf7" stroke-width="4" stroke-linecap="round"/>
          <circle cx="70" cy="6" r="6" fill="#ffd166"/>
          <rect x="34" y="26" width="72" height="56" rx="18" fill="#eef2fb"/>
          <rect x="48" y="46" width="18" height="14" rx="6" fill="#3660d9"/>
          <rect x="74" y="46" width="18" height="14" rx="6" fill="#3660d9"/>
          <rect x="20" y="86" width="100" height="90" rx="22" fill="#d7deef"/>
          <rect x="42" y="106" width="56" height="40" rx="10" fill="#3660d9"/>
          <circle cx="70" cy="126" r="10" fill="#8fd8e0"/>
          <rect x="0" y="96" width="24" height="16" rx="8" fill="#c3ccdf" transform="rotate(-12 12 104)"/>
          <rect x="116" y="96" width="24" height="16" rx="8" fill="#c3ccdf" transform="rotate(20 128 104)"/>
          <g transform="translate(118,86)">
            <polygon points="0,20 18,10 36,20 18,30" fill="#8fe3d0"/>
            <polygon points="0,20 18,30 18,48 0,38" fill="#5fcdb4"/>
            <polygon points="36,20 18,30 18,48 36,38" fill="#78dcc4"/>
          </g>
          <rect x="34" y="176" width="18" height="26" rx="8" fill="#c3ccdf"/>
          <rect x="88" y="176" width="18" height="26" rx="8" fill="#c3ccdf"/>
        </g>
      </svg>
    </div>
  </div>
</div>
{% endblock %}
