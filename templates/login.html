{% extends "base.html" %}
{% block title %}Login - Asset Management System{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>AssetHub Login</h1>
    <p class="subtitle">Sign in to manage your organization's assets</p>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" name="identifier" required autofocus placeholder="admin or admin@company.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-field">
          <input type="password" name="password" id="loginPassword" required placeholder="••••••••">
          <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">👁️</button>
        </div>
      </div>
      <div class="section-header" style="margin-bottom:14px;">
        <label class="checkbox-row"><input type="checkbox" name="remember"> Remember me</label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size:13px; color:var(--primary);">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Login</button>
    </form>
    <p class="foot-link">Don't have an account? <a href="{{ url_for('auth.register') }}" style="color:var(--primary); font-weight:600;">Register</a></p>
  </div>
</div>
{% endblock %}
